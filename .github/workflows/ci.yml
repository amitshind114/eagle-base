name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Smoke-test: verify ALL top-level packages import cleanly
      - name: Smoke import check
        run: |
          python -c "
          # core
          import core.config, core.logger, core.db
          # instruments
          import instruments.models, instruments.storage, instruments.resolver, instruments.token_map
          # backtesting
          import backtesting.engine, backtesting.metrics, backtesting.models
          import backtesting.multi_runner, backtesting.walk_forward
          # strategies & derivatives
          import strategies.sma_crossover
          import derivatives.options
          # paper trading
          import paper.portfolio, paper.executor, paper.broker
          # api (all routers)
          import api.main
          import api.routers.data, api.routers.instruments
          import api.routers.backtesting, api.routers.risk
          import api.routers.paper, api.routers.live
          print('All smoke imports OK')
          "
        env:
          ANGELONE_API_KEY: ""
          ANGELONE_CLIENT_ID: ""
          ANGELONE_PASSWORD: ""
          ANGELONE_TOTP_SECRET: ""

      # Full test suite with coverage
      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short -x \
            --cov=. \
            --cov-report=term-missing \
            --cov-omit="tests/*,ui/*,scripts/*,*/__init__.py"
        env:
          ANGELONE_API_KEY: ""
          ANGELONE_CLIENT_ID: ""
          ANGELONE_PASSWORD: ""
          ANGELONE_TOTP_SECRET: ""
