name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Smoke-test: verify all top-level packages import cleanly
      - name: Smoke import check
        run: |
          python -c "
          import core.config, core.logger, core.db
          import instruments.models, instruments.storage, instruments.resolver
          import backtesting.engine, backtesting.metrics, backtesting.models
          import backtesting.multi_runner
          import strategies.sma_crossover
          import derivatives.options
          print('All smoke imports OK')
          "
        env:
          ANGELONE_API_KEY: ""
          ANGELONE_CLIENT_ID: ""
          ANGELONE_PASSWORD: ""
          ANGELONE_TOTP_SECRET: ""

      # Full test suite with coverage
      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short -x \
            --cov=. \
            --cov-report=term-missing \
            --cov-omit="tests/*,ui/*,scripts/*,*/__init__.py"
        env:
          ANGELONE_API_KEY: ""
          ANGELONE_CLIENT_ID: ""
          ANGELONE_PASSWORD: ""
          ANGELONE_TOTP_SECRET: ""
