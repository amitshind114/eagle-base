name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short -x
        env:
          ANGELONE_API_KEY: ""
          ANGELONE_CLIENT_ID: ""
          ANGELONE_PASSWORD: ""
          ANGELONE_TOTP_SECRET: ""
