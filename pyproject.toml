[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "eagle-base"
version = "0.4.0"
description = "Modular algorithmic trading framework with multi-broker support"
requires-python = ">=3.11"

# ── Ruff (linter + formatter)
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations (type hints)
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
    "ANN401",  # dynamically typed expressions (Any)
    "B008",    # do not perform function calls in default args
]

[tool.ruff.lint.isort]
known-first-party = [
    "api", "ai", "backtesting", "brokers", "core",
    "data", "derivatives", "domain", "instruments",
    "live", "paper", "reporting", "risk", "strategies", "ui"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ── Black (formatter — kept as fallback / pre-commit)
[tool.black]
line-length = 100
target-version = ["py311"]

# ── Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ── Mypy (optional strict mode)
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
